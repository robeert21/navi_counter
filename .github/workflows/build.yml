name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Embed API keys
        shell: python
        run: |
          import os
          yt = os.environ["YOUTUBE_API_KEY"]
          gem = os.environ["GEMINI_API_KEY"]
          with open("_secrets.py", "w") as f:
              f.write(f'YOUTUBE_API_KEY = "{yt}"\n')
              f.write(f'GEMINI_API_KEY = "{gem}"\n')
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Build EXE
        run: pyinstaller jaxi.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: navi_counter-Windows
          path: dist/navi_counter/
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/navi_counter/**
          generate_release_notes: true
