<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1920px;
      height: 1080px;
      background: transparent;
      overflow: hidden;
      font-family: 'Arial Black', Arial, sans-serif;
    }

    #widget {
      position: fixed;
      bottom: 32px;
      right: 32px;
      text-align: center;
      user-select: none;
    }

    #label {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0.75;
      text-shadow: 0 1px 4px #000;
      margin-bottom: 2px;
    }

    #counter {
      font-size: 96px;
      font-weight: 900;
      color: #F5D000;
      line-height: 1;
      text-shadow:
        2px 2px 0 #000,
        -2px -2px 0 #000,
        2px -2px 0 #000,
        -2px 2px 0 #000;
    }

    #counter.bump {
      animation: bump 0.3s ease-out;
    }

    @keyframes bump {
      0%   { transform: scale(1); }
      45%  { transform: scale(1.25); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div id="widget">
    <div id="label">când joacă NAVI?</div>
    <div id="counter">0</div>
  </div>

  <script>
    const WS = 'ws://127.0.0.1:8765';
    const counterEl = document.getElementById('counter');

    function connect() {
      const ws = new WebSocket(WS);
      ws.onmessage = e => {
        try {
          const d = JSON.parse(e.data);
          if (typeof d.count === 'number') {
            counterEl.textContent = d.count;
            counterEl.classList.remove('bump');
            void counterEl.offsetWidth;
            counterEl.classList.add('bump');
          }
        } catch {}
      };
      ws.onclose = () => setTimeout(connect, 3000);
      ws.onerror = () => ws.close();
    }
    connect();
  </script>
</body>
</html>
